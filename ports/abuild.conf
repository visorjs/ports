# ports/abuild.conf — global abuild config for visorjs wasm64 packages.
#
# Mounted read-only into the builder container and pointed to via
# ABUILD_CONF (see build.sh / mkkeys.sh). Never baked into the image:
# editing this file takes effect on the next build, no image rebuild.

# Alpine's default CFLAGS/LDFLAGS are ELF- and x86/ARM-specific, and a
# recipe that drives its upstream build system hands them straight to the
# wrappers rather than composing its own line. Trimmed to what this target
# accepts: -fstack-clash-protection has no wasm lowering, and --as-needed /
# --sort-common / -z pack-relative-relocs are ELF linker concepts wasm-ld
# rejects outright.
export CFLAGS="-Os -Wformat -Werror=format-security"
export CXXFLAGS="$CFLAGS"
export LDFLAGS=""

# All three wrappers are named by their mounted /work path, never as bare
# PATH names: the image bakes its own copy of tools/wasm-toolchain/bin/,
# so a bare `reactor-cc` resolves to whatever the image was built with and
# silently ignores every wrapper edit until the image is rebuilt. The
# linker was already spelled this way; the compilers are, for the same
# reason.
export CARCH=wasm64
export CC=/work/tools/wasm-toolchain/bin/reactor-cc
export CXX=/work/tools/wasm-toolchain/bin/reactor-c++
export LD=/work/tools/wasm-toolchain/bin/reactor-link
export REPODEST=/work/ports/repo
export SRCDEST=/work/ports/cache
export PACKAGER="visorjs"

# A C++ recipe links with reactor-link++ instead of $LD, the same way a
# C recipe links with $LD directly rather than through $CC — build.sh
# only exports CC/CXX/LD (see below), so a C++ build() must reference
# /work/tools/wasm-toolchain/bin/reactor-link++ explicitly.

# DISTFILES_MIRROR (<repo>/visorjs/distfiles), when the environment sets
# it, is tried by abuild before upstream for a file not already in SRCDEST;
# unset or empty, abuild fetches upstream. A dev build may set it; a
# release build (ports/visorjs-release.sh) always gets it empty.
if [ -n "${DISTFILES_MIRROR:-}" ]; then
  export DISTFILES_MIRROR
else
  unset DISTFILES_MIRROR
fi
