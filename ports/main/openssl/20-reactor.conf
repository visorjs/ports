## Reactor wasm64 target (plain WebAssembly, no WASI). Loaded via
## OPENSSL_LOCAL_CONFIG_DIR — vendor/openssl stays pristine.
my %targets = (
    "wasm64-reactor" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "reactor-cc",
        CXX              => "reactor-c++",
        AR               => "llvm-ar",
        RANLIB           => "llvm-ranlib",
        CFLAGS           => "-O2 -fno-exceptions",
        CXXFLAGS         => "-O2 -fno-exceptions",
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        thread_scheme    => "pthreads",
        dso_scheme       => "",
        perlasm_scheme   => "void",
    },
);
